name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

# Раннер даёт 7 ГБ памяти. Две параллельные сборки его убивают, поэтому
# старую отменяем.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Что за машина
        run: |
          sw_vers
          df -h /System/Volumes/Data
          ls /Applications | grep -i "^Xcode"

      - name: Выбрать Xcode из versions.json
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "versions.json требует Xcode $XCODE_VERSION"
          # Xcode_26.2.app это симлинк на Xcode_26.2.0.app, удалять "лишние"
          # версии нельзя, снесёт цель симлинка вместе с тулчейном
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: rsync из homebrew
        # macOS 15.4+ идёт с openrsync, он валит копирование фреймворков
        # с Permission denied на Info.plist, issue 1887
        run: |
          brew install rsync
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          brew unlink bazelisk 2>/dev/null || true

      - name: Кэш Bazel
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-
            bazel-

      - name: Конфигурация сборки
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_TEAM_ID: ${{ secrets.TG_TEAM_ID }}
        run: |
          set -eu
          [ -n "$TG_API_ID" ] || { echo "секрет TG_API_ID пуст"; exit 1; }
          [ -n "$TG_API_HASH" ] || { echo "секрет TG_API_HASH пуст"; exit 1; }
          [ -n "$TG_TEAM_ID" ] || { echo "секрет TG_TEAM_ID пуст"; exit 1; }
          mkdir -p build-input
          python3 - <<'PY'
          import json, os
          json.dump({
              "bundle_id": "uz.dkx.app",
              "api_id": os.environ["TG_API_ID"],
              "api_hash": os.environ["TG_API_HASH"],
              "team_id": os.environ["TG_TEAM_ID"],
              "app_center_id": "0",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              # свой url scheme, чтобы не конфликтовать с официальным Telegram
              # на одном устройстве
              "app_specific_url_scheme": "dkxtg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
          }, open("build-input/fork-configuration.json", "w"), indent=4)
          PY
          python3 -c "import json;d=json.load(open('build-input/fork-configuration.json'));d['api_hash']='***';print(json.dumps(d,indent=2))"

      - name: Сертификат и профили
        env:
          P12: ${{ secrets.TG_DISTRIBUTION_P12 }}
          PROFILE_TELEGRAM: ${{ secrets.TG_PROFILE_TELEGRAM }}
          PROFILE_SHARE: ${{ secrets.TG_PROFILE_SHARE }}
          PROFILE_WIDGET: ${{ secrets.TG_PROFILE_WIDGET }}
          PROFILE_NOTIFSERVICE: ${{ secrets.TG_PROFILE_NOTIFSERVICE }}
          PROFILE_NOTIFCONTENT: ${{ secrets.TG_PROFILE_NOTIFCONTENT }}
          PROFILE_INTENTS: ${{ secrets.TG_PROFILE_INTENTS }}
          PROFILE_BROADCAST: ${{ secrets.TG_PROFILE_BROADCAST }}
        run: |
          set -eu
          mkdir -p build-input/codesigning/certs build-input/codesigning/profiles
          printf '%s' "$P12" | base64 --decode > build-input/codesigning/certs/distribution.p12
          for pair in \
            "Telegram:$PROFILE_TELEGRAM" \
            "Share:$PROFILE_SHARE" \
            "Widget:$PROFILE_WIDGET" \
            "NotificationService:$PROFILE_NOTIFSERVICE" \
            "NotificationContent:$PROFILE_NOTIFCONTENT" \
            "Intents:$PROFILE_INTENTS" \
            "BroadcastUpload:$PROFILE_BROADCAST" ; do
            name="${pair%%:*}"
            data="${pair#*:}"
            [ -n "$data" ] || { echo "секрет для профиля $name пуст"; exit 1; }
            printf '%s' "$data" | base64 --decode > "build-input/codesigning/profiles/${name}.mobileprovision"
          done
          echo "профилей разложено:"
          ls -1 build-input/codesigning/profiles

      - name: Импорт сертификата в keychain
        # ImportCertificates.py из репозитория не используем. Он импортирует
        # p12 с пустым паролем и с check_result=False, то есть провал импорта
        # молчит, а падает уже следующий шаг с невнятной ошибкой про
        # SecItemCopyMatching. Делаем то же самое явно и с проверкой.
        env:
          P12_PASSWORD: ${{ secrets.TG_P12_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN=temp.keychain
          KEYCHAIN_PW=actions

          # GitHub маскирует значение секрета, но не его длину. Если длина
          # не совпадает с ожидаемой, значит секрет приехал битым.
          echo "длина пароля из секрета: ${#P12_PASSWORD}"
          echo "размер p12: $(wc -c < build-input/codesigning/certs/distribution.p12) байт"
          openssl pkcs12 -in build-input/codesigning/certs/distribution.p12             -passin "pass:${P12_PASSWORD}" -nokeys -noout             && echo "openssl открывает p12 этим паролем"             || echo "openssl НЕ открывает p12 этим паролем"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security import build-input/codesigning/certs/distribution.p12             -k "$KEYCHAIN" -P "$P12_PASSWORD"             -T /usr/bin/codesign -T /usr/bin/security -A
          security import build-system/AppleWWDRCAG3.cer             -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security -A || true

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "=== личности для подписи кода ==="
          security find-identity -v -p codesigning "$KEYCHAIN"
          # если личностей ноль, дальше идти бессмысленно
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"             || { echo "Apple Distribution в keychain не появился"; exit 1; }

      - name: Сборка
        run: |
          set -eu
          OFFSET="$(cat build_number_offset)"
          BUILD_NUMBER="$(( OFFSET + GITHUB_RUN_NUMBER ))"
          APP_VERSION="$(python3 -c 'import json;print(json.load(open("versions.json"))["app"]) ')"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "собираем $APP_VERSION build $BUILD_NUMBER"

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_dkx \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-input/fork-configuration.json \
            --codesigningInformationPath=build-input/codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Что собралось
        if: always()
        run: |
          ls -la build/artifacts 2>/dev/null || echo "артефактов нет"
          df -h /System/Volumes/Data
          du -sh ~/telegram-bazel-cache 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DkxApp-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: build/artifacts/*.ipa
          retention-days: 30
          if-no-files-found: error
