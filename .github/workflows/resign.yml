name: Resign

# Переподпись уже выложенной сборки новыми профилями, когда в них добавили
# телефон. Полная сборка не нужна. Сертификат тот же, поэтому библиотеки не
# трогаем, меняются только вложенные профили и подписи приложения и шести
# расширений. Адрес сборки в секрете, чтобы путь установки не светился в
# публичном репозитории.
on:
  workflow_dispatch:

concurrency:
  group: resign
  cancel-in-progress: false

jobs:
  resign:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Сборка, сертификат и профили
        env:
          IPA_URL: ${{ secrets.DKX_IPA_URL }}
          P12: ${{ secrets.TG_DISTRIBUTION_P12 }}
          PROFILE_TELEGRAM: ${{ secrets.TG_PROFILE_TELEGRAM }}
          PROFILE_SHARE: ${{ secrets.TG_PROFILE_SHARE }}
          PROFILE_WIDGET: ${{ secrets.TG_PROFILE_WIDGET }}
          PROFILE_NOTIFSERVICE: ${{ secrets.TG_PROFILE_NOTIFSERVICE }}
          PROFILE_NOTIFCONTENT: ${{ secrets.TG_PROFILE_NOTIFCONTENT }}
          PROFILE_INTENTS: ${{ secrets.TG_PROFILE_INTENTS }}
          PROFILE_BROADCAST: ${{ secrets.TG_PROFILE_BROADCAST }}
        run: |
          set -eu
          mkdir -p work/profiles
          [ -n "$IPA_URL" ] || { echo "секрет DKX_IPA_URL пуст"; exit 1; }
          curl -fsS -o work/app.ipa "$IPA_URL"
          echo "сборка скачана, $(wc -c < work/app.ipa) байт"
          printf '%s' "$P12" | base64 --decode > work/distribution.p12
          for pair in \
            "Telegram:$PROFILE_TELEGRAM" \
            "Share:$PROFILE_SHARE" \
            "Widget:$PROFILE_WIDGET" \
            "NotificationService:$PROFILE_NOTIFSERVICE" \
            "NotificationContent:$PROFILE_NOTIFCONTENT" \
            "Intents:$PROFILE_INTENTS" \
            "BroadcastUpload:$PROFILE_BROADCAST" ; do
            name="${pair%%:*}"
            data="${pair#*:}"
            [ -n "$data" ] || { echo "секрет для профиля $name пуст"; exit 1; }
            printf '%s' "$data" | base64 --decode > "work/profiles/${name}.mobileprovision"
          done

      - name: Импорт сертификата в keychain
        env:
          P12_PASSWORD: ${{ secrets.TG_P12_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN=temp.keychain
          KEYCHAIN_PW=actions
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security import work/distribution.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution" \
            || { echo "Apple Distribution в keychain не появился"; exit 1; }

      - name: Переподпись
        run: |
          set -eu
          cd work
          unzip -q app.ipa
          APP=Payload/Telegram.app
          IDENTITY="$(security find-identity -v -p codesigning temp.keychain | grep "Apple Distribution" | head -1 | awk '{print $2}')"

          # Профиль к части приложения подбираем по bundle id, а не по имени файла
          : > map.txt
          for p in profiles/*.mobileprovision; do
            security cms -D -i "$p" > "$p.plist"
            id="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$p.plist" | cut -d. -f2-)"
            echo "$id=$p" >> map.txt
          done

          sign() {
            bundle="$1"
            bid="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$bundle/Info.plist")"
            prof="$(grep "^$bid=" map.txt | head -1 | cut -d= -f2)"
            [ -n "$prof" ] || { echo "нет профиля для $bid"; exit 1; }
            # Права берём из текущей подписи. В профиле они с масками, а в
            # подписи нужны точные, те, с которыми собрано приложение.
            codesign -d --entitlements - --xml "$bundle" > entitlements.plist 2>/dev/null
            cp "$prof" "$bundle/embedded.mobileprovision"
            codesign -f -s "$IDENTITY" --entitlements entitlements.plist "$bundle"
            devices="$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$prof.plist" | grep -c '^    ')"
            echo "подписан $bid, телефонов в профиле $devices"
          }

          # Расширения раньше приложения, подпись приложения их включает
          for ext in "$APP"/PlugIns/*.appex; do
            sign "$ext"
          done
          sign "$APP"
          codesign --verify --deep --strict "$APP"
          echo "подпись проверена"

          rm -f ../Telegram.ipa
          zip -qry ../Telegram.ipa Payload $( [ -d SwiftSupport ] && echo SwiftSupport )
          echo "готово, $(wc -c < ../Telegram.ipa) байт"

      - uses: actions/upload-artifact@v4
        with:
          name: DkxApp-resigned-${{ github.run_number }}
          path: Telegram.ipa
          retention-days: 3
